services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - fin_workspace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fin_workspace"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      - PORT=15730
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    ports:
      - "${PORT:-15730}:15730"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  recurring-worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      - RECURRING_WORKER_URL=http://app:15730/api/internal/recurring/run
      - RECURRING_WORKER_INTERVAL_MS=60000
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  financial-plan-worker:
    build:
      context: .
      target: worker
    command: ["node", "financial-plan-worker.mjs"]
    env_file: .env
    environment:
      - FINANCIAL_PLAN_WORKER_URL=http://app:15730/api/internal/financial-plans/close
      - FINANCIAL_PLAN_WORKER_INTERVAL_MS=300000
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  fin_workspace_postgres_data:
