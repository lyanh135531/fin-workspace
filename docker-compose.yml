services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - fin_workspace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fin_workspace"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      - PORT=15730
      - NEXTAUTH_URL=http://localhost:15730
    ports:
      - "${PORT:-15730}:15730"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  fin_workspace_postgres_data:
