<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0c0f14" />
    <title>Felix đang ngoại tuyến</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("fin-workspace-mode");
          var theme = localStorage.getItem("fin-workspace-theme") || "sunrise";
          document.documentElement.setAttribute("data-theme", theme);
          if (
            mode === "dark" ||
            (!mode && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.setAttribute("data-mode", "dark");
          } else {
            document.documentElement.setAttribute("data-mode", "light");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root,
      html[data-mode="light"] {
        color-scheme: light dark;
        --bg: #faf8f5;
        --surface: #ffffff;
        --surface-secondary: #f4f1ec;
        --surface-hover: #efece6;
        --border: #e6e1da;
        --border-strong: #d0c9bf;
        --text: #141c2b;
        --text-secondary: #525d6f;
        --text-muted: #7e899b;
        --primary: #e85538;
        --primary-hover: #d44428;
        --primary-active: #bf391f;
        --primary-soft: rgba(232, 85, 56, 0.12);
        --primary-fg: #ffffff;
        --success: #16935c;
        --success-soft: rgba(22, 147, 92, 0.12);
        --warning: #d97706;
        --warning-soft: rgba(217, 119, 6, 0.14);
      }

      html[data-mode="dark"] {
        --bg: #0c0f14;
        --surface: #131820;
        --surface-secondary: #1a202b;
        --surface-hover: #212936;
        --border: #262f3d;
        --border-strong: #384559;
        --text: #f5f7fa;
        --text-secondary: #b6c0ce;
        --text-muted: #7f8b9e;
        --primary: #f26b50;
        --primary-hover: #ff8269;
        --primary-active: #df573c;
        --primary-soft: rgba(242, 107, 80, 0.14);
        --primary-fg: #ffffff;
        --success: #34d399;
        --success-soft: rgba(52, 211, 153, 0.12);
        --warning: #fbbf24;
        --warning-soft: rgba(251, 191, 36, 0.14);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-mode="light"]) {
          --bg: #0c0f14;
          --surface: #131820;
          --surface-secondary: #1a202b;
          --surface-hover: #212936;
          --border: #262f3d;
          --border-strong: #384559;
          --text: #f5f7fa;
          --text-secondary: #b6c0ce;
          --text-muted: #7f8b9e;
          --primary: #f26b50;
          --primary-hover: #ff8269;
          --primary-active: #df573c;
          --primary-soft: rgba(242, 107, 80, 0.14);
          --primary-fg: #ffffff;
          --success: #34d399;
          --success-soft: rgba(52, 211, 153, 0.12);
          --warning: #fbbf24;
          --warning-soft: rgba(251, 191, 36, 0.14);
        }
      }

      html[data-theme="ocean"] {
        --primary: #0f6cbd;
        --primary-hover: #0c5a9e;
        --primary-active: #09487f;
        --primary-soft: rgba(15, 108, 189, 0.14);
      }

      html[data-theme="ocean"][data-mode="dark"] {
        --primary: #38bdf8;
        --primary-hover: #7dd3fc;
        --primary-active: #0ea5e9;
        --primary-soft: rgba(56, 189, 248, 0.14);
        --primary-fg: #0c0f14;
      }

      html[data-theme="forest"] {
        --primary: #15803d;
        --primary-hover: #166534;
        --primary-active: #14532d;
        --primary-soft: rgba(21, 128, 61, 0.14);
      }

      html[data-theme="forest"][data-mode="dark"] {
        --primary: #34d399;
        --primary-hover: #6ee7b7;
        --primary-active: #10b981;
        --primary-soft: rgba(52, 211, 153, 0.14);
        --primary-fg: #0c0f14;
      }

      html[data-theme="lavender"] {
        --primary: #6d28d9;
        --primary-hover: #5b21b6;
        --primary-active: #4c1d95;
        --primary-soft: rgba(109, 40, 217, 0.14);
      }

      html[data-theme="lavender"][data-mode="dark"] {
        --primary: #a78bfa;
        --primary-hover: #c4b5fd;
        --primary-active: #8b5cf6;
        --primary-soft: rgba(167, 139, 250, 0.14);
        --primary-fg: #0c0f14;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background-color: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Manrope",
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: min(100%, 380px);
        padding: 24px 20px 20px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background-color: var(--surface);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      @media (min-width: 640px) {
        .card {
          width: min(100%, 400px);
          padding: 28px 24px 24px;
        }
      }

      .hero-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .brand-badge {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .logo-box {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        background: var(--surface-secondary);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .wifi-pill {
        position: absolute;
        bottom: -4px;
        right: -4px;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background-color: var(--surface);
        border: 1px solid var(--border);
        color: var(--warning);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        background-color: var(--warning-soft);
        color: var(--warning);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--warning);
        position: relative;
      }

      .status-dot::after {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        background-color: var(--warning);
        opacity: 0.4;
        animation: pulse 2s infinite ease-in-out;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.7);
          opacity: 0;
        }
      }

      h1 {
        margin: 0 0 6px;
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.025em;
        color: var(--text);
      }

      p.description {
        margin: 0 0 18px;
        color: var(--text-secondary);
        font-size: 0.8125rem;
        line-height: 1.5;
        max-width: 31ch;
      }

      .status-panel {
        width: 100%;
        border-radius: 16px;
        background-color: var(--surface-secondary);
        border: 1px solid var(--border);
        padding: 4px 14px;
        margin-bottom: 18px;
        text-align: left;
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 0;
        font-size: 0.75rem;
      }

      .status-row + .status-row {
        border-top: 1px solid var(--border);
      }

      .status-row-label {
        color: var(--text-muted);
        font-weight: 500;
      }

      .status-row-value {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-weight: 600;
        color: var(--text);
      }

      .status-row-value.safe {
        color: var(--success);
      }

      .safe-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--success);
      }

      .actions {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .btn {
        width: 100%;
        min-height: 40px;
        padding: 9px 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-radius: 12px;
        font-size: 0.84rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease,
          transform 0.12s ease;
        border: 1px solid transparent;
        font-family: inherit;
      }

      .btn:active:not(:disabled) {
        transform: scale(0.985);
      }

      .btn:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .btn-primary {
        background-color: var(--primary);
        color: var(--primary-fg);
        border-color: var(--primary);
      }

      .btn-primary:hover:not(:disabled) {
        background-color: var(--primary-hover);
        border-color: var(--primary-hover);
      }

      .btn-primary:active:not(:disabled) {
        background-color: var(--primary-active);
      }

      .btn-primary:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .btn-secondary {
        background-color: transparent;
        color: var(--text-secondary);
        border-color: var(--border);
      }

      .btn-secondary:hover {
        background-color: var(--surface-secondary);
        color: var(--text);
        border-color: var(--border-strong);
      }

      .spin {
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="hero-header">
        <div class="brand-badge">
          <div class="logo-box" aria-hidden="true">
            <svg
              width="36"
              height="36"
              viewBox="0 0 64 64"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <defs>
                <linearGradient id="felix-mark" x1="15" y1="10" x2="52" y2="49">
                  <stop stop-color="#ff5b3d" />
                  <stop offset="1" stop-color="#7d6df1" />
                </linearGradient>
                <linearGradient id="felix-accent" x1="20" y1="11" x2="45" y2="38">
                  <stop stop-color="#7d6df1" stop-opacity="0.2" />
                  <stop offset="1" stop-color="#ffffff" stop-opacity="0.36" />
                </linearGradient>
              </defs>
              <g transform="translate(0, 4)">
                <path
                  d="M15.4 50.4c-2.2-.2-3.3-1.8-2.8-4.3l4.9-27.3C19 10.7 25.2 6.6 34.6 6.6h14.8c3.5 0 5.1 2.1 4.3 5.3-1.6 6.5-6.7 10.2-14.3 10.2h-7.2c-5.8 0-9.3 3.1-10.4 9.1l-2.2 11.9c-.9 4.9-1.9 7.7-4.2 7.3Z"
                  fill="url(#felix-mark)"
                />
                <path
                  d="M28.3 41.2 30 32c.8-4.5 4.2-7.1 9-7.1h9.8c2.9 0 4.2 1.8 3.4 4.5-1.9 7.2-7 11.8-14.9 11.8h-9Z"
                  fill="url(#felix-mark)"
                  transform="translate(-3, 2)"
                />
                <path
                  d="M18.2 35.2c4.7-9.7 11.6-18.5 23.2-24.7-11.7 2.1-19.3 8.5-22.2 18.9l-1 5.8Z"
                  fill="url(#felix-accent)"
                />
              </g>
            </svg>
          </div>
          <div class="wifi-pill" title="Mất kết nối" aria-hidden="true">
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="2" y1="2" x2="22" y2="22"></line>
              <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
              <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
              <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.82"></path>
              <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
          </div>
        </div>

        <div class="status-pill">
          <span class="status-dot"></span>
          <span>Mất kết nối mạng</span>
        </div>
      </div>

      <h1>Felix đang ngoại tuyến</h1>
      <p class="description">
        Vui lòng kiểm tra Wi-Fi hoặc dữ liệu di động để tiếp tục đồng bộ sổ quỹ.
      </p>

      <div class="status-panel" aria-live="polite">
        <div class="status-row">
          <span class="status-row-label">Dữ liệu tài chính</span>
          <span class="status-row-value safe">
            <span class="safe-dot" aria-hidden="true"></span>
            <span>An toàn tuyệt đối</span>
          </span>
        </div>
        <div class="status-row">
          <span class="status-row-label">Trạng thái kết nối</span>
          <span class="status-row-value">
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
            </svg>
            <span id="live-status-text">Tự động tải lại khi có mạng</span>
          </span>
        </div>
      </div>

      <div class="actions">
        <button
          type="button"
          id="retry-button"
          class="btn btn-primary"
          onclick="handleRetry()"
        >
          <svg
            id="retry-icon"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path
              d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
            ></path>
          </svg>
          <span id="retry-label">Thử kết nối lại</span>
        </button>

        <a href="/overview" class="btn btn-secondary">
          <span>Về trang tổng quan</span>
        </a>
      </div>
    </main>

    <script>
      function handleRetry() {
        var btn = document.getElementById("retry-button");
        var icon = document.getElementById("retry-icon");
        var label = document.getElementById("retry-label");

        if (btn) btn.disabled = true;
        if (icon) icon.classList.add("spin");
        if (label) label.textContent = "Đang kết nối lại...";

        setTimeout(function () {
          window.location.reload();
        }, 400);
      }

      window.addEventListener("online", function () {
        var liveText = document.getElementById("live-status-text");
        var btn = document.getElementById("retry-button");
        var icon = document.getElementById("retry-icon");
        var label = document.getElementById("retry-label");

        if (liveText) {
          liveText.textContent = "Đã có mạng! Đang kết nối...";
        }
        if (btn) btn.disabled = true;
        if (icon) icon.classList.add("spin");
        if (label) label.textContent = "Đang kết nối lại...";

        setTimeout(function () {
          window.location.reload();
        }, 600);
      });
    </script>
  </body>
</html>
