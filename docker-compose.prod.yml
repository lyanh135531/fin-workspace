# docker-compose.prod.yml — Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file removes the database port mapping (only accessible via internal
# Docker network) and adds a healthcheck to the app service.

services:
  db:
    ports: !reset []
    # No ports exposed — PostgreSQL is only reachable within the Docker network.

  app:
    environment:
      - PORT=15730
      # Set NEXTAUTH_URL to your actual production domain
      - NEXTAUTH_URL=${NEXTAUTH_URL:?Set NEXTAUTH_URL to your production domain e.g. https://fin.example.com}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:15730/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
